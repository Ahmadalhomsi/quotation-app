# Single-package workspace: include the root package so pnpm recognizes
# scripts (pnpm run <script>) and workspace semantics correctly.
packages:
  - '*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  deepmerge-ts: '>=8.0.0'
  basic-ftp: '>=6.2.1'
  zod: '>=4.6.6'